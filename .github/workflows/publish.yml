name: Publish package

# geckou/ui と同じタグ駆動。<パッケージのディレクトリ名>@<バージョン>（例: billing@0.1.0）
#
# **公開できるのは production に入っているコミットだけ。** タグも workflow_dispatch も
# 任意の ref から起動できるため、そのままだと未マージのブランチをチェックアウトした実行に
# NPM_TOKEN が渡る。publish の前に yarn install / yarn build が走るので、その ref の
# 任意のコードがトークンを持つジョブ内で実行されることになる。下の 2 つの検査で塞いでいる。
#
#   1. タグ（または dispatch した ref）のコミットが origin/production に含まれること
#   2. タグのバージョン部分が、対象 package.json の version と一致すること
#
# あわせて npm-publish Environment を通す。ワークフロー定義を書き換えた ref からの
# 起動まで塞ぐなら、リポジトリ設定でこの Environment に承認者かタグ制限（`*@*`）を足す。
on:
  push:
    tags: ['*@*']
  workflow_dispatch:
    inputs:
      package:
        description: 公開するパッケージのディレクトリ名（billing 等）
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - uses: actions/checkout@v5
        with:
          # production との包含関係を見るため、履歴を持ってチェックアウトする
          fetch-depth: 0

      # レビューを通っていないコミットからの公開を止める。依存インストール（= その ref の
      # コードの実行）より前に置く。push（タグ）でも workflow_dispatch でも
      # GITHUB_SHA は起動した ref の先頭を指す
      - name: Verify the commit is on production
        run: |
          git fetch --no-tags --quiet origin production

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/production; then
            echo "::error::${GITHUB_SHA} は origin/production に含まれていません。version を上げる PR をマージしたうえで、production でタグを打つ（yarn release <パッケージ>）か、手動実行なら Use workflow from に production を選んでください"
            exit 1
          fi

      - name: Resolve target package
        id: target
        env:
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
        run: |
          if [ -n "$INPUT_PACKAGE" ]; then
            PACKAGE="$INPUT_PACKAGE"
          else
            PACKAGE="${GITHUB_REF_NAME%@*}"
          fi

          # パッケージ名はタグ名か手動実行の入力から来て、そのままパスの一部になる。
          # 先に形式を検査して、../ によるパストラバーサルと、後続の node へ渡す
          # 文字列への注入の余地を消す（ディレクトリ名はケバブケースに限る）
          # grep は行単位で照合するため、改行を含む値だと「1行でも一致すれば通過」に
          # なってしまう（後続の GITHUB_OUTPUT への書き込みが注入される）。
          # bash の =~ は文字列全体を見るので、改行混じりの値をここで落とせる
          if [[ ! "$PACKAGE" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            # 検査に落ちた値はそのまま出さない。改行を含む値だと 2 行目が
            # ワークフローコマンド（::warning:: 等）として解釈されるため。
            # 値そのものはタグ名・実行時の入力として run の画面に出ている
            echo "::error::パッケージ名の形式が不正です（ケバブケースのディレクトリ名のみ）。タグ名か手動実行の入力を確認してください"
            exit 1
          fi

          PACKAGE_JSON="$PWD/packages/$PACKAGE/package.json"

          if [ ! -f "$PACKAGE_JSON" ]; then
            echo "::error::packages/$PACKAGE が存在しません（ref: $GITHUB_REF_NAME）"
            exit 1
          fi

          # タグ起動のときは、タグのバージョン部分と package.json の version の一致を見る。
          # ずれていると、タグが指すものと実際に公開されるものが食い違う
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME##*@}"
            # パスは環境変数で渡す（node の式に文字列として展開しない）
            VERSION="$(PACKAGE_JSON="$PACKAGE_JSON" node -p 'require(process.env.PACKAGE_JSON).version')"

            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::タグ $GITHUB_REF_NAME と packages/$PACKAGE/package.json の version ($VERSION) が一致しません"
              exit 1
            fi
          fi

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 依存パッケージが先にビルドされている必要がある
      - name: Build all packages
        run: yarn build

      # 公開済みのバージョンに対して起動されることがある（初回リリースを
      # workflow_dispatch で行い、記録のために後からタグを打つ場合など）。
      # その場合 npm publish は必ず失敗するので、実行を冪等にする
      - name: Publish to npm
        working-directory: packages/${{ steps.target.outputs.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"

          # 未公開なら npm view はエラー（パッケージ未登録）か空（バージョン未登録）になる
          PUBLISHED="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"

          if [ -n "$PUBLISHED" ]; then
            echo "$NAME@$VERSION は既に公開済みのため、publish をスキップします"
            exit 0
          fi

          npm publish --access public
