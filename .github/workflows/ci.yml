name: CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      # リリース時の API 差分検査の回帰テスト。npm レジストリには接続しない
      # （公開物は --published-tarball で差し替える）
      - name: API Diff Guard Test
        run: bash scripts/test-api-diff.sh

      # どこからでも公開できるようにするコマンドの回帰テスト。
      # 偽のリポジトリを作って動かすだけなので node も yarn も要らない
      - name: Release Command Test
        run: bash scripts/test-release-command.sh

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format Check
        run: yarn format:check

      - name: Type Check
        run: yarn type-check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
