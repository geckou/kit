name: CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Type Check
        run: yarn type-check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
