name: CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      # リリース時の API 差分検査の回帰テスト。npm レジストリには接続しない
      # （公開物は --published-tarball で差し替える）
      - name: API Diff Guard Test
        run: bash scripts/test-api-diff.sh

      # どこからでも公開できるようにするコマンドの回帰テスト。
      # 偽のリポジトリを作って動かすだけなので node も yarn も要らない
      - name: Release Command Test
        run: bash scripts/test-release-command.sh

      # 公開物の形式検査（下の Check module formats）自身の回帰テスト。
      # 偽の packages/ を組み立てて動かすだけなので依存インストールは要らない
      - name: Module Format Check Test
        run: bash scripts/test-module-formats.sh

      - run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format Check
        run: yarn format:check

      - name: Type Check
        run: yarn type-check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # 任意 peer（stripe）の型が公開する .d.ts に漏れていないか
      - name: Check optional peer types
        run: yarn check:optional-peer-types

      # exports の import / require 条件と、実際の出力（ESM / CJS）が食い違っていないか
      - name: Check module formats
        run: yarn check:module-formats
